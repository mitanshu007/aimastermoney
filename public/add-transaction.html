<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Transaction | FinTech Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        .bg-gradient-primary { background: linear-gradient(135deg, #2563eb, #10b981); }
        .hover-gradient-primary:hover { background: linear-gradient(135deg, #1d4ed8, #059669); }
        .glass-card { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); }
        .toast-enter { animation: slideIn 0.3s ease-out forwards; }
        .toast-exit { animation: fadeOut 0.3s ease-in forwards; }
        @keyframes slideIn { from { transform: translateY(100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @keyframes fadeOut { from { opacity: 1; } to { opacity: 0; } }
    </style>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center p-4">
    <!-- Card -->
    <div class="glass-card w-full max-w-[650px] rounded-2xl shadow-[0_8px_30px_rgb(0,0,0,0.06)] p-8 border border-gray-100 relative overflow-hidden">
        
        <!-- Header -->
        <div class="mb-8 text-center sm:text-left">
            <h1 class="text-2xl font-bold text-gray-900 mb-2">Add New Transaction</h1>
            <p class="text-gray-500 text-sm">Record your income or expense to keep your finances updated.</p>
        </div>

        <form id="transaction-form" class="space-y-6">
            <!-- Row 1: Type & Category -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
                <!-- Transaction Type -->
                <div class="space-y-2">
                    <label class="block text-sm font-semibold text-gray-700">Transaction Type <span class="text-red-500">*</span></label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-gray-400">
                            <i data-lucide="arrow-left-right" class="w-5 h-5"></i>
                        </div>
                        <select id="type" class="w-full pl-10 pr-4 py-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition-all text-gray-700 bg-white appearance-none cursor-pointer">
                            <option value="" disabled selected>Select Type</option>
                            <option value="income">Income</option>
                            <option value="expense">Expense</option>
                        </select>
                        <div class="absolute inset-y-0 right-0 pr-3 flex items-center pointer-events-none text-gray-400">
                            <i data-lucide="chevron-down" class="w-4 h-4"></i>
                        </div>
                    </div>
                    <p class="text-red-500 text-xs hidden" id="type-error">Transaction type is required</p>
                </div>

                <!-- Category -->
                <div class="space-y-2">
                    <label class="block text-sm font-semibold text-gray-700">Category <span class="text-red-500">*</span></label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-gray-400">
                            <i data-lucide="layout-grid" class="w-5 h-5"></i>
                        </div>
                        <select id="category" class="w-full pl-10 pr-4 py-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition-all text-gray-700 bg-white appearance-none cursor-pointer">
                            <option value="" disabled selected>Select Category</option>
                            <option value="food">Food</option>
                            <option value="travel">Travel</option>
                            <option value="shopping">Shopping</option>
                            <option value="salary">Salary</option>
                            <option value="bills">Bills</option>
                            <option value="entertainment">Entertainment</option>
                            <option value="investment">Investment</option>
                            <option value="healthcare">Healthcare</option>
                            <option value="education">Education</option>
                        </select>
                        <div class="absolute inset-y-0 right-0 pr-3 flex items-center pointer-events-none text-gray-400">
                            <i data-lucide="chevron-down" class="w-4 h-4"></i>
                        </div>
                    </div>
                    <p class="text-red-500 text-xs hidden" id="category-error">Category is required</p>
                </div>
            </div>

            <!-- Row 2: Amount & Date -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
                <!-- Amount -->
                <div class="space-y-2">
                    <label class="block text-sm font-semibold text-gray-700">Amount <span class="text-red-500">*</span></label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-gray-500 font-medium">
                            ₹
                        </div>
                        <input type="number" id="amount" placeholder="Enter amount" class="w-full pl-8 pr-4 py-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition-all text-gray-900 bg-white placeholder-gray-400 [appearance:textfield] [&::-webkit-outer-spin-button]:appearance-none [&::-webkit-inner-spin-button]:appearance-none" step="0.01">
                    </div>
                    <p class="text-red-500 text-xs hidden" id="amount-error">Valid amount is required</p>
                </div>

                <!-- Date -->
                <div class="space-y-2">
                    <label class="block text-sm font-semibold text-gray-700">Date <span class="text-red-500">*</span></label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-gray-400">
                            <i data-lucide="calendar" class="w-5 h-5"></i>
                        </div>
                        <input type="date" id="date" class="w-full pl-10 pr-4 py-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition-all text-gray-700 bg-white cursor-pointer">
                    </div>
                    <p class="text-red-500 text-xs hidden" id="date-error">Date is required</p>
                </div>
            </div>

            <!-- Payment Method -->
            <div class="space-y-2">
                <label class="block text-sm font-semibold text-gray-700">Payment Method</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-gray-400">
                        <i data-lucide="credit-card" class="w-5 h-5"></i>
                    </div>
                    <select id="payment-method" class="w-full pl-10 pr-4 py-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition-all text-gray-700 bg-white appearance-none cursor-pointer">
                        <option value="" disabled selected>Select method</option>
                        <option value="cash">Cash</option>
                        <option value="credit-card">Credit Card</option>
                        <option value="debit-card">Debit Card</option>
                        <option value="upi">UPI</option>
                        <option value="bank-transfer">Bank Transfer</option>
                        <option value="wallet">Wallet</option>
                    </select>
                    <div class="absolute inset-y-0 right-0 pr-3 flex items-center pointer-events-none text-gray-400">
                        <i data-lucide="chevron-down" class="w-4 h-4"></i>
                    </div>
                </div>
            </div>

            <!-- Description -->
            <div class="space-y-2">
                <label class="block text-sm font-semibold text-gray-700">Description</label>
                <div class="relative">
                    <div class="absolute top-3 left-3 pointer-events-none text-gray-400">
                        <i data-lucide="file-text" class="w-5 h-5"></i>
                    </div>
                    <textarea id="description" rows="3" placeholder="Add notes or details about this transaction." class="w-full pl-10 pr-4 py-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition-all text-gray-700 bg-white resize-none"></textarea>
                </div>
            </div>

            <hr class="border-gray-100 border-t my-2">

            <!-- Buttons -->
            <div class="flex flex-col-reverse sm:flex-row gap-4 pt-2">
                <button type="button" onclick="handleCancel()" class="w-full sm:w-1/3 py-3 px-4 rounded-xl text-gray-700 font-semibold bg-gray-100 hover:bg-gray-200 transition-colors focus:ring-2 focus:ring-gray-200 outline-none">
                    Cancel
                </button>
                <button type="submit" class="w-full sm:w-2/3 py-3 px-4 rounded-xl text-white font-semibold flex items-center justify-center gap-2 bg-gradient-primary hover-gradient-primary shadow-lg shadow-blue-500/20 active:scale-[0.98] transition-all focus:ring-2 focus:ring-blue-500 outline-none">
                    <i data-lucide="plus-circle" class="w-5 h-5"></i>
                    Add Transaction
                </button>
            </div>
        </form>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-6 right-6 lg:bottom-10 lg:right-10 hidden items-center gap-3 bg-white px-5 py-4 rounded-xl shadow-xl border border-gray-100 z-50">
        <div class="bg-green-100 p-2 rounded-full text-green-600">
            <i data-lucide="check" class="w-5 h-5"></i>
        </div>
        <div>
            <h4 class="text-sm font-semibold text-gray-900">Success</h4>
            <p class="text-sm text-gray-500">Transaction added successfully!</p>
        </div>
        <button onclick="hideToast()" class="ml-4 text-gray-400 hover:text-gray-600 transition-colors">
            <i data-lucide="x" class="w-4 h-4"></i>
        </button>
    </div>

    <script>
        // Initialize simple-icons (Lucide)
        lucide.createIcons();

        // Set default date to today
        document.getElementById('date').valueAsDate = new Date();

        const form = document.getElementById('transaction-form');
        const toast = document.getElementById('toast');
        let toastTimeout;

        function showError(fieldId, show) {
            const errorElement = document.getElementById(`${fieldId}-error`);
            const inputElement = document.getElementById(fieldId);
            if (show) {
                errorElement.classList.remove('hidden');
                inputElement.classList.add('border-red-500', 'ring-1', 'ring-red-500');
                inputElement.classList.remove('border-gray-200', 'focus:border-transparent', 'focus:ring-blue-500');
            } else {
                errorElement.classList.add('hidden');
                inputElement.classList.remove('border-red-500', 'ring-1', 'ring-red-500');
                inputElement.classList.add('border-gray-200', 'focus:border-transparent', 'focus:ring-blue-500');
            }
        }

        function validateForm() {
            let isValid = true;
            
            // Validate Type
            const type = document.getElementById('type').value;
            if (!type) { showError('type', true); isValid = false; }
            else { showError('type', false); }

            // Validate Category
            const category = document.getElementById('category').value;
            if (!category) { showError('category', true); isValid = false; }
            else { showError('category', false); }

            // Validate Amount
            const amount = document.getElementById('amount').value;
            if (!amount || isNaN(amount) || amount <= 0) { showError('amount', true); isValid = false; }
            else { showError('amount', false); }

            // Validate Date
            const date = document.getElementById('date').value;
            if (!date) { showError('date', true); isValid = false; }
            else { showError('date', false); }

            return isValid;
        }

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            
            if (validateForm()) {
                // Show Success Toast
                showToast();
                // Reset form
                form.reset();
                document.getElementById('date').valueAsDate = new Date();
                
                // Remove any previous error classes on reset
                ['type', 'category', 'amount', 'date'].forEach(id => showError(id, false));
            }
        });

        // Clear errors when user interacts with input
        ['type', 'category', 'amount', 'date'].forEach(id => {
            document.getElementById(id).addEventListener('input', () => {
                showError(id, false);
            });
            document.getElementById(id).addEventListener('change', () => {
                showError(id, false);
            });
        });

        function showToast() {
            clearTimeout(toastTimeout);
            toast.classList.remove('hidden', 'toast-exit');
            toast.classList.add('flex', 'toast-enter');
            
            toastTimeout = setTimeout(() => {
                hideToast();
            }, 3000);
        }

        function hideToast() {
            toast.classList.remove('toast-enter');
            toast.classList.add('toast-exit');
            setTimeout(() => {
                toast.classList.add('hidden');
                toast.classList.remove('flex', 'toast-exit');
            }, 300); // 300ms matches CSS animation
        }

        function handleCancel() {
            if(confirm('Are you sure you want to cancel? Any unsaved data will be cleared.')) {
                form.reset();
                document.getElementById('date').valueAsDate = new Date();
                ['type', 'category', 'amount', 'date'].forEach(id => showError(id, false));
            }
        }
    </script>
</body>
</html>
